<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FounderOS · by Lumostat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Lumostat brand palette */
  --navy:#081526; --navy-dark:#10213A; --navy-mid:#16294A;
  --blue:#4E6A9C; --blue-light:#B7CCE2; --ice:#F8FBFC;
  --gray:#777777; --gray-light:#EAEAEA;

  --bg:#EFF1F0; --bg-elev:#FFFFFF; --bg-elev2:#F8FBFC; --bg-elev3:#EAEAEA;
  --border:rgba(8,21,38,.12); --border-soft:rgba(8,21,38,.07);
  --text:#081526; --text-dim:#5A6472; --text-faint:rgba(8,21,38,.42);
  --accent:#4E6A9C; --accent-soft:rgba(78,106,156,.14); --accent-text:#FFFFFF;
  --success:#2F7D52; --success-soft:rgba(47,125,82,.13);
  --warning:#9C7A1E; --warning-soft:rgba(156,122,30,.14);
  --danger:#A8433F; --danger-soft:rgba(168,67,63,.12);
  --info:#4E6A9C; --info-soft:rgba(78,106,156,.14);
  --radius-sm:8px; --radius:14px; --radius-lg:20px; --pill:100px;
  --shadow-lg:0 4px 10px rgba(8,21,38,.06), 0 20px 40px rgba(8,21,38,.10);
  --shadow-md:0 1px 2px rgba(8,21,38,.04), 0 8px 24px rgba(8,21,38,.06);
  --ease:cubic-bezier(.22,.61,.36,1);
  --font-display:'Manrope','Inter',sans-serif;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --font-mono:'SF Mono','Cascadia Code','Roboto Mono',Consolas,monospace;
}
html[data-theme="dark"]{
  --bg:#081526; --bg-elev:#0D1C30; --bg-elev2:#10213A; --bg-elev3:#16294A;
  --border:rgba(183,204,226,.14); --border-soft:rgba(183,204,226,.08);
  --text:#F8FBFC; --text-dim:#B7CCE2; --text-faint:rgba(248,251,252,.45);
  --accent-text:#FFFFFF;
  --shadow-lg:0 20px 60px -12px rgba(0,0,0,.55);
  --shadow-md:0 8px 24px -6px rgba(0,0,0,.4);
}
*{box-sizing:border-box; margin:0; padding:0;}
::selection{background:var(--blue-light); color:var(--navy);}
body{
  background:var(--bg); color:var(--text); font-family:var(--font-body);
  font-size:13.6px; line-height:1.5; overflow:hidden; height:100vh; width:100vw;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
}
h1,h2,h3,h4{font-family:var(--font-display); letter-spacing:-0.02em;}
::-webkit-scrollbar{width:9px; height:9px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:var(--text-faint);}
.sidebar-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);}
.sidebar-nav::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.24);}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
input,textarea,select{font-family:inherit; color:inherit; background:none; border:none; outline:none;}
svg{display:block; flex-shrink:0;}

/* ---------- layout shell ---------- */
.app-shell{display:flex; height:100vh; width:100vw;}

/* Sidebar */
.sidebar{
  width:252px; flex-shrink:0;
  background:linear-gradient(165deg,var(--navy) 0%,var(--navy-dark) 62%,var(--navy-mid) 100%);
  border-right:1px solid rgba(0,0,0,.2);
  display:flex; flex-direction:column; transition:width .25s var(--ease); overflow:hidden; position:relative;
}
.sidebar::before{
  content:''; position:absolute; inset:0; opacity:.55; pointer-events:none;
  background:radial-gradient(560px 380px at 88% 6%, rgba(78,106,156,.35), transparent 60%);
}
.sidebar.collapsed{width:76px;}
.sidebar-brand{
  display:flex; align-items:center; gap:10px; padding:22px 18px 18px; flex-shrink:0; position:relative; z-index:1;
}
.brand-mark{
  width:32px; height:32px; border-radius:10px; background:linear-gradient(145deg,var(--blue),var(--navy-dark));
  display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:800;
  font-size:15px; color:#fff; flex-shrink:0; box-shadow:0 4px 14px -4px rgba(78,106,156,.6); border:1px solid rgba(255,255,255,.14);
}
.brand-text{font-family:var(--font-display); font-weight:700; font-size:16.5px; letter-spacing:.01em; white-space:nowrap; color:#F8FBFC;}
.brand-sub{font-size:9.5px; color:var(--blue-light); text-transform:uppercase; letter-spacing:1.6px; margin-top:0px; white-space:nowrap; opacity:.75;}
.sidebar-nav{flex:1; overflow-y:auto; padding:8px 12px; position:relative; z-index:1;}
.nav-section-label{font-size:9.5px; text-transform:uppercase; letter-spacing:1.3px; color:var(--blue-light); opacity:.55; padding:16px 12px 7px; white-space:nowrap;}
.nav-item{
  display:flex; align-items:center; gap:11px; padding:9px 12px; border-radius:var(--pill);
  color:rgba(248,251,252,.62); font-size:13.1px; font-weight:500; margin-bottom:2px; white-space:nowrap; position:relative;
  transition:background .18s var(--ease), color .18s var(--ease);
}
.nav-item:hover{background:rgba(255,255,255,.07); color:#F8FBFC;}
.nav-item.active{background:#F8FBFC; color:var(--navy);}
.nav-item.active svg{stroke:var(--navy);}
.nav-item svg{width:16px; height:16px; stroke:rgba(248,251,252,.62); fill:none; stroke-width:1.7; flex-shrink:0;}
.nav-count{margin-left:auto; font-family:var(--font-mono); font-size:10.3px; color:rgba(248,251,252,.55); background:rgba(255,255,255,.1); padding:1px 7px; border-radius:var(--pill);}
.nav-item.active .nav-count{background:rgba(8,21,38,.1); color:var(--navy);}
.sidebar-footer{padding:12px; border-top:1px solid rgba(255,255,255,.08); display:flex; flex-direction:column; gap:2px; position:relative; z-index:1;}
.collapse-btn{
  display:flex; align-items:center; justify-content:center; width:100%; padding:9px; border-radius:var(--pill);
  color:rgba(248,251,252,.5); margin-top:4px;
}
.collapse-btn:hover{background:rgba(255,255,255,.08); color:#F8FBFC;}
.sidebar.collapsed .brand-text,.sidebar.collapsed .brand-sub,.sidebar.collapsed .nav-section-label,
.sidebar.collapsed .nav-item span, .sidebar.collapsed .nav-count{display:none;}
.sidebar.collapsed .nav-item{justify-content:center;}
.sidebar.collapsed .sidebar-brand{justify-content:center; padding:22px 0 18px;}

/* Main */
.main{flex:1; display:flex; flex-direction:column; min-width:0; height:100vh;}
.topbar{
  height:62px; flex-shrink:0; display:flex; align-items:center; gap:14px; padding:0 24px;
  border-bottom:1px solid var(--border-soft); background:var(--bg-elev);
}
.crumb{font-size:12.3px; color:var(--text-faint); display:flex; align-items:center; gap:6px; flex-shrink:0;}
.crumb b{color:var(--text); font-weight:700; font-family:var(--font-display);}
.search-trigger{
  flex:1; max-width:420px; display:flex; align-items:center; gap:9px; background:var(--bg-elev2);
  border:1px solid var(--border); border-radius:var(--pill); padding:8px 14px; color:var(--text-faint); font-size:12.6px;
  transition:border-color .15s;
}
.search-trigger:hover{border-color:var(--blue);}
.search-trigger svg{width:15px;height:15px;stroke:var(--text-faint); fill:none; stroke-width:1.8;}
.kbd{margin-left:auto; font-family:var(--font-mono); font-size:10.5px; background:var(--bg-elev3); padding:2px 6px; border-radius:5px; border:1px solid var(--border);}
.topbar-actions{margin-left:auto; display:flex; align-items:center; gap:8px; flex-shrink:0;}
.icon-btn{
  width:34px; height:34px; display:flex; align-items:center; justify-content:center; border-radius:12px;
  color:var(--text-dim); transition:background .15s,color .15s;
}
.icon-btn:hover{background:var(--bg-elev2); color:var(--navy);}
.icon-btn svg{width:17px;height:17px; stroke:currentColor; fill:none; stroke-width:1.7;}
.btn-primary{
  display:flex; align-items:center; gap:7px; background:var(--accent); color:var(--accent-text); font-weight:600;
  font-size:12.8px; padding:10px 18px; border-radius:var(--pill); box-shadow:0 6px 16px -6px rgba(78,106,156,.5);
  transition:background .18s var(--ease), transform .12s, box-shadow .18s var(--ease);
}
.btn-primary:hover{background:var(--navy-dark); transform:translateY(-1px); box-shadow:0 10px 20px -6px rgba(78,106,156,.55);}
.btn-primary:active{transform:scale(.97);}
.btn-primary svg{width:15px;height:15px; stroke:var(--accent-text); fill:none; stroke-width:2.2;}
.btn-secondary svg, .btn-ghost svg, .btn-danger svg{width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:1.9; flex-shrink:0;}
.btn-secondary{
  display:flex; align-items:center; gap:7px; background:transparent; border:1px solid var(--border); color:var(--text);
  font-size:12.6px; font-weight:500; padding:9px 17px; border-radius:var(--pill); transition:background .15s;
}
.btn-secondary:hover{background:var(--bg-elev2);}
.btn-ghost{color:var(--text-dim); font-size:12.6px; padding:8px 13px; border-radius:var(--pill);}
.btn-ghost:hover{background:var(--bg-elev2); color:var(--text);}
.btn-danger{color:var(--danger); font-size:12.6px; padding:8px 15px; border-radius:var(--pill); border:1px solid var(--danger-soft); background:var(--danger-soft);}
.btn-danger:hover{filter:brightness(1.1);}

.view{flex:1; overflow-y:auto; padding:28px 32px 80px; background:var(--bg);}
.view-header{display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:24px; gap:16px; flex-wrap:wrap;}
.view-title{font-family:var(--font-display); font-weight:700; font-size:25px; letter-spacing:-.02em;}
.view-subtitle{color:var(--text-faint); font-size:12.6px; margin-top:5px;}

/* Cards / glass */
.glass{
  background:var(--bg-elev); border:1px solid var(--border-soft); border-radius:var(--radius-lg);
  backdrop-filter:blur(14px);
}
.card{
  background:var(--bg-elev2); border:1px solid var(--border-soft); border-radius:var(--radius-lg);
  transition:border-color .2s var(--ease), transform .2s var(--ease), box-shadow .2s var(--ease);
}
.card:hover{border-color:var(--border); transform:translateY(-2px); box-shadow:var(--shadow-md);}

/* Stat strip */
.stat-strip{display:grid; grid-template-columns:repeat(auto-fit,minmax(128px,1fr)); gap:10px; margin-bottom:26px;}
.stat-card{
  padding:17px 17px; position:relative; overflow:hidden; cursor:pointer;
}
.stat-card .stat-num{font-family:var(--font-display); font-size:23px; font-weight:800; letter-spacing:-.02em;}
.stat-card .stat-label{font-size:11.1px; color:var(--text-faint); margin-top:3px; text-transform:uppercase; letter-spacing:.6px;}
.stat-card .stat-icon{position:absolute; right:13px; top:13px; opacity:.6;}
.stat-card .stat-icon svg{width:15px;height:15px; stroke:var(--blue); fill:none; stroke-width:1.6;}

.section-block{margin-bottom:28px;}
.section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
.section-title{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.9px; color:var(--text-dim); display:flex; align-items:center; gap:7px;}
.section-title svg{width:14px;height:14px; stroke:var(--text-faint); fill:none; stroke-width:1.8;}
.link-more{font-size:12px; color:var(--accent); font-weight:600;}
.link-more:hover{text-decoration:underline;}

/* project grid & cards */
.project-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(255px,1fr)); gap:12px;}
.pcard{
  padding:17px; display:flex; flex-direction:column; gap:10px; cursor:grab; position:relative;
}
.pcard.dragging{opacity:.4;}
.pcard-top{display:flex; align-items:flex-start; gap:11px;}
.pcard-logo{
  width:38px; height:38px; border-radius:12px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:700; font-size:15px; color:#fff; background:linear-gradient(145deg,var(--blue),var(--navy-dark));
  object-fit:cover; overflow:hidden;
}
.pcard-logo img{width:100%; height:100%; object-fit:cover;}
.pcard-name{font-weight:700; font-size:14.3px; display:flex; align-items:center; gap:6px;}
.pcard-name .pin-ico{width:11px; height:11px; stroke:var(--accent); fill:var(--accent);}
.pcard-desc{font-size:12px; color:var(--text-faint); flex:1; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.pcard-badges{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
.badge{
  font-size:10.5px; padding:3px 9px; border-radius:var(--pill); font-weight:600; letter-spacing:.2px; white-space:nowrap;
  display:inline-flex; align-items:center; gap:4px;
}
.pcard-footer{display:flex; align-items:center; justify-content:space-between; margin-top:2px; padding-top:10px; border-top:1px solid var(--border-soft);}
.pcard-metric{font-family:var(--font-mono); font-size:11.6px; color:var(--text-dim);}
.pcard-metric b{color:var(--success);}
.pcard-metric.neg b{color:var(--danger);}
.pcard-actions{display:flex; gap:2px; opacity:0; transition:opacity .15s;}
.pcard:hover .pcard-actions{opacity:1;}
.pcard-actions button{width:24px;height:24px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--text-faint);}
.pcard-actions button:hover{background:var(--bg-elev3); color:var(--text);}
.pcard-actions svg{width:13px;height:13px; stroke:currentColor; fill:none; stroke-width:1.8;}
.pcard-actions svg.filled{fill:currentColor;}

/* Empty state */
.empty-state{
  display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px 20px;
  color:var(--text-faint); text-align:center; gap:10px;
}
.empty-state .e-icon{width:52px;height:52px; border-radius:16px; background:var(--bg-elev2); display:flex; align-items:center; justify-content:center; margin-bottom:6px;}
.empty-state .e-icon svg{width:22px;height:22px; stroke:var(--text-faint); fill:none; stroke-width:1.5;}
.empty-state .e-title{font-size:14px; font-weight:600; color:var(--text-dim);}
.empty-state .e-sub{font-size:12.3px; max-width:280px;}

/* skeletons */
.skeleton{background:linear-gradient(90deg,var(--bg-elev2) 25%,var(--bg-elev3) 37%,var(--bg-elev2) 63%); background-size:400% 100%; animation:sk 1.4s ease infinite; border-radius:var(--radius);}
@keyframes sk{0%{background-position:100% 50%;}100%{background-position:0 50%;}}

/* filter bar */
.filter-bar{display:flex; align-items:center; gap:8px; margin-bottom:18px; flex-wrap:wrap;}
.chip-select{
  display:flex; align-items:center; gap:6px; background:var(--bg-elev2); border:1px solid var(--border); border-radius:var(--pill);
  padding:7px 12px; font-size:12.1px; color:var(--text-dim);
}
.chip-select svg{width:13px; height:13px; stroke:var(--text-faint); fill:none; stroke-width:1.8; flex-shrink:0;}
.seg-toggle button svg{width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:1.8; flex-shrink:0;}
.chip-select select{cursor:pointer; color:var(--text);}
.search-inline{
  display:flex; align-items:center; gap:7px; background:var(--bg-elev2); border:1px solid var(--border); border-radius:var(--pill);
  padding:7px 13px; flex:1; min-width:160px; max-width:280px;
}
.search-inline svg{width:14px;height:14px; stroke:var(--text-faint); fill:none; stroke-width:1.8;}
.search-inline input{flex:1; font-size:12.6px; color:var(--text);}
.search-inline input::placeholder{color:var(--text-faint);}
.seg-toggle{display:flex; background:var(--bg-elev2); border:1px solid var(--border); border-radius:var(--pill); padding:2px; margin-left:auto;}
.seg-toggle button{padding:6px 12px; border-radius:var(--pill); font-size:11.6px; color:var(--text-faint);}
.seg-toggle button.active{background:var(--navy); color:#fff;}

/* modal */
.modal-overlay{
  position:fixed; inset:0; background:rgba(8,21,38,.55); backdrop-filter:blur(3px); display:flex; align-items:flex-start;
  justify-content:center; z-index:200; padding:6vh 20px; overflow-y:auto; animation:fadeIn .15s ease;
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal{
  background:var(--bg-elev); border:1px solid var(--border); border-radius:24px; width:100%; max-width:560px;
  box-shadow:var(--shadow-lg); animation:modalIn .18s cubic-bezier(.2,.9,.3,1.2); max-height:88vh; display:flex; flex-direction:column;
}
.modal.wide{max-width:820px;}
@keyframes modalIn{from{opacity:0; transform:translateY(10px) scale(.98);} to{opacity:1; transform:translateY(0) scale(1);}}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:20px 24px; border-bottom:1px solid var(--border-soft); flex-shrink:0;}
.modal-title{font-family:var(--font-display); font-weight:700; font-size:18px;}
.modal-body{padding:22px 24px; overflow-y:auto;}
.modal-foot{padding:16px 24px; border-top:1px solid var(--border-soft); display:flex; justify-content:flex-end; gap:8px; flex-shrink:0;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:11.4px; font-weight:600; color:var(--text-dim); margin-bottom:6px; text-transform:uppercase; letter-spacing:.5px;}
.field input[type=text],.field input[type=number],.field input[type=date],.field input[type=url],.field input[type=password],
.field textarea, .field select{
  width:100%; background:var(--bg-elev2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; font-size:13px; color:var(--text);
  transition:border-color .15s;
}
.field input:focus, .field textarea:focus, .field select:focus{border-color:var(--accent);}
.field textarea{resize:vertical; min-height:64px; font-family:var(--font-body);}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.field-hint{font-size:11px; color:var(--text-faint); margin-top:4px;}
.swatch-row{display:flex; gap:8px; flex-wrap:wrap;}
.swatch{width:26px; height:26px; border-radius:8px; border:2px solid transparent; cursor:pointer;}
.swatch.active{border-color:var(--text);}
.upload-zone{
  border:1.5px dashed var(--border); border-radius:var(--radius); padding:16px; display:flex; align-items:center; gap:12px; cursor:pointer;
  transition:border-color .15s;
}
.upload-zone:hover{border-color:var(--blue);}
.upload-zone svg{width:22px;height:22px; stroke:var(--text-faint); fill:none; stroke-width:1.6;}
.upload-preview{width:44px;height:44px; border-radius:12px; object-fit:cover; background:var(--bg-elev3);}

/* toast */
.toast-wrap{position:fixed; bottom:22px; right:22px; z-index:400; display:flex; flex-direction:column; gap:8px;}
.toast{
  background:var(--bg-elev); border:1px solid var(--border); padding:12px 17px; border-radius:var(--radius); font-size:12.8px;
  box-shadow:var(--shadow-lg); display:flex; align-items:center; gap:9px; animation:toastIn .2s ease; min-width:200px;
}
@keyframes toastIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
.toast .t-dot{width:7px;height:7px; border-radius:50%; background:var(--success); flex-shrink:0;}
.toast.danger .t-dot{background:var(--danger);}

/* project detail */
.pd-header{border-radius:var(--radius-lg); overflow:hidden; margin-bottom:20px; border:1px solid var(--border-soft);}
.pd-banner{height:126px; background:linear-gradient(120deg,var(--navy) 0%,var(--blue) 130%); position:relative;}
.pd-banner::after{content:''; position:absolute; inset:0; background:radial-gradient(420px 260px at 85% 10%, rgba(183,204,226,.35), transparent 60%);}
.pd-banner img{width:100%; height:100%; object-fit:cover;}
.pd-body{background:var(--bg-elev); padding:0 22px 20px; position:relative;}
.pd-logo{
  width:64px; height:64px; border-radius:18px; border:4px solid var(--bg-elev); margin-top:-32px;
  background:linear-gradient(145deg,var(--blue),var(--navy-dark));
  display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:24px; color:#fff;
  overflow:hidden;
}
.pd-logo img{width:100%; height:100%; object-fit:cover;}
.pd-titlerow{display:flex; align-items:flex-end; justify-content:space-between; gap:14px; margin-top:10px; flex-wrap:wrap;}
.pd-name{font-family:var(--font-display); font-weight:700; font-size:22px; letter-spacing:-.01em;}
.pd-desc{color:var(--text-dim); font-size:13px; margin-top:5px; max-width:640px;}
.pd-meta{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; align-items:center;}
.pd-actions{display:flex; gap:8px; flex-wrap:wrap;}

.tabs{display:flex; gap:2px; border-bottom:1px solid var(--border-soft); margin-bottom:20px; overflow-x:auto;}
.tab-btn{padding:10px 14px; font-size:12.8px; font-weight:600; color:var(--text-faint); border-bottom:2px solid transparent; white-space:nowrap;}
.tab-btn.active{color:var(--blue); border-color:var(--blue);}
.tab-btn:hover{color:var(--text);}

.kv-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.kv-item{background:var(--bg-elev2); border:1px solid var(--border-soft); border-radius:var(--radius); padding:13px 15px;}
.kv-label{font-size:10.4px; text-transform:uppercase; letter-spacing:.6px; color:var(--text-faint); margin-bottom:5px;}
.kv-value{font-size:13.6px; font-weight:700;}
.kv-value.mono{font-family:var(--font-mono); font-weight:600;}

.list-row{
  display:flex; align-items:center; gap:12px; padding:12px 15px; border-radius:var(--radius); border:1px solid var(--border-soft);
  background:var(--bg-elev2); margin-bottom:8px; transition:border-color .15s;
}
.list-row:hover{border-color:var(--border);}
.checkbox{
  width:18px; height:18px; border-radius:6px; border:1.6px solid var(--border); flex-shrink:0; display:flex; align-items:center;
  justify-content:center; transition:background .15s, border-color .15s;
}
.checkbox.checked{background:var(--success); border-color:var(--success);}
.checkbox svg{width:11px;height:11px; stroke:#fff; fill:none; stroke-width:3;}
.row-title{font-weight:600; font-size:13.2px;}
.row-title.done{text-decoration:line-through; color:var(--text-faint);}
.row-sub{font-size:11.3px; color:var(--text-faint); margin-top:2px;}
.progress-bar{width:70px; height:5px; background:var(--bg-elev3); border-radius:var(--pill); overflow:hidden; flex-shrink:0;}
.progress-fill{height:100%; background:var(--accent); border-radius:var(--pill);}

.note-card{background:var(--bg-elev2); border:1px solid var(--border-soft); border-radius:var(--radius); padding:13px 15px; margin-bottom:9px; font-size:13px; position:relative;}
.note-meta{font-size:10.8px; color:var(--text-faint); margin-top:8px;}
.note-del{position:absolute; top:8px; right:8px; opacity:0; transition:opacity .15s;}
.note-card:hover .note-del{opacity:1;}

.activity-item{display:flex; gap:11px; padding:9px 0; border-bottom:1px solid var(--border-soft);}
.activity-item:last-child{border:none;}
.act-dot{width:7px;height:7px; border-radius:50%; background:var(--accent); margin-top:6px; flex-shrink:0;}
.act-text{font-size:12.8px;}
.act-time{font-size:11px; color:var(--text-faint); margin-top:1px;}

.priority-dot{width:7px; height:7px; border-radius:50%; display:inline-block;}

/* settings */
.settings-grid{display:grid; grid-template-columns:1fr; gap:16px; max-width:640px;}
.settings-card{padding:19px 21px;}
.settings-row{display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--border-soft);}
.settings-row:last-child{border:none;}
.settings-row-label{font-size:13.2px; font-weight:600;}
.settings-row-sub{font-size:11.6px; color:var(--text-faint); margin-top:2px;}
.toggle{width:38px; height:22px; border-radius:var(--pill); background:var(--bg-elev3); position:relative; transition:background .2s; flex-shrink:0; cursor:pointer;}
.toggle.on{background:var(--accent);}
.toggle::after{content:''; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; transition:transform .2s;}
.toggle.on::after{transform:translateX(16px);}

.label-chip-editor{display:flex; align-items:center; gap:10px; padding:9px 12px; border:1px solid var(--border-soft); border-radius:var(--radius); margin-bottom:7px; background:var(--bg-elev2);}

/* calendar */
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
.cal-dow{font-size:10.5px; text-transform:uppercase; color:var(--text-faint); text-align:center; padding-bottom:6px; letter-spacing:.5px;}
.cal-cell{
  min-height:84px; border-radius:12px; border:1px solid var(--border-soft); padding:6px; font-size:11px; background:var(--bg-elev2);
  display:flex; flex-direction:column; gap:3px;
}
.cal-cell.other{opacity:.35;}
.cal-cell.today{border-color:var(--blue);}
.cal-daynum{font-family:var(--font-mono); font-size:11px; color:var(--text-faint);}
.cal-ev{background:var(--accent-soft); color:var(--accent); border-radius:5px; padding:1.5px 5px; font-size:9.8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

/* password field */
.pw-row{display:flex; align-items:center; gap:8px;}
.pw-toggle{width:30px;height:30px; display:flex; align-items:center; justify-content:center; border-radius:10px; color:var(--text-faint); flex-shrink:0;}
.pw-toggle:hover{background:var(--bg-elev3);}

/* search modal */
.search-results{max-height:50vh; overflow-y:auto;}
.search-result-item{display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:var(--radius); cursor:pointer;}
.search-result-item:hover{background:var(--bg-elev2);}
.search-result-icon{width:30px;height:30px; border-radius:10px; background:var(--bg-elev3); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.search-result-icon svg{width:14px;height:14px; stroke:var(--text-dim); fill:none; stroke-width:1.7;}
.sr-title{font-size:13px; font-weight:600;}
.sr-sub{font-size:11px; color:var(--text-faint);}

.mono{font-family:var(--font-mono);}
.text-success{color:var(--success);} .text-danger{color:var(--danger);} .text-warning{color:var(--warning);} .text-info{color:var(--info);}
.hidden{display:none !important;}
.fade-in{animation:fadeIn .18s ease;}

.wizard-steps{display:flex; gap:6px; margin-bottom:18px;}
.wizard-dot{flex:1; height:3px; border-radius:3px; background:var(--bg-elev3);}
.wizard-dot.active{background:var(--accent);}

.hamburger-btn{display:none;}
.sidebar-backdrop{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:140; opacity:0; pointer-events:none; transition:opacity .2s;}
.sidebar-backdrop.show{opacity:1; pointer-events:auto;}

@media (max-width:820px){
  .sidebar{position:fixed; z-index:150; height:100vh; left:0; top:0; transform:translateX(-100%); transition:transform .25s; width:250px !important;}
  .sidebar.mobile-open{transform:translateX(0);}
  .sidebar.collapsed{width:250px;}
  .sidebar.collapsed .brand-text,.sidebar.collapsed .brand-sub,.sidebar.collapsed .nav-section-label,.sidebar.collapsed .nav-item span,.sidebar.collapsed .nav-count{display:block;}
  .sidebar.collapsed .nav-item{justify-content:flex-start;}
  .collapse-btn{display:none;}
  .hamburger-btn{display:flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:12px; color:var(--text-dim); flex-shrink:0;}
  .hamburger-btn svg{width:19px;height:19px; stroke:currentColor; fill:none; stroke-width:1.8;}
  .hamburger-btn:hover{background:var(--bg-elev2);}
  .field-row{grid-template-columns:1fr;}
  .kv-grid{grid-template-columns:1fr;}
  .view{padding:18px 14px 80px;}
  .search-trigger{max-width:none;}
  .search-trigger span:not(.kbd){display:none;}
  .kbd{display:none;}
  .topbar{padding:0 12px; gap:8px;}
  .btn-primary .btn-label{display:none;}
  .btn-primary{padding:9px 11px;}
  .crumb{display:none;}
}
</style>
</head>
<body>
<div id="app" class="app-shell"></div>

<script>
/* =========================================================
   FounderOS — single-file offline founder operating system
   ========================================================= */

/* ---------- Icon set (inline SVG, no external deps) ---------- */
const ICN = {

  chevR:'<path d="M9 6l6 6-6 6"/>',

  handshake:'<path d="M2 12l4-4 4 3-3 4z"/><path d="M22 12l-4-4-6.5 5.5a1.5 1.5 0 002 2.2L17 12"/><path d="M9 11l3 2.5"/>',

  layers:'<path d="M12 2l9 5-9 5-9-5z"/><path d="M3 12l9 5 9-5M3 17l9 5 9-5"/>',
  bell:'<path d="M18 8a6 6 0 10-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M13.7 21a2 2 0 01-3.4 0"/>',
  sun:'<circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8L6 18M18 6l1.8-1.8"/>',
  moon:'<path d="M20 14.5A8.5 8.5 0 119.5 4a7 7 0 0010.5 10.5z"/>',
  folder:'<path d="M3 6a1 1 0 011-1h5l2 2h9a1 1 0 011 1v10a1 1 0 01-1 1H4a1 1 0 01-1-1z"/>',
  download:'<path d="M12 4v12M7 11l5 5 5-5"/><path d="M4 20h16"/>',
  filter:'<path d="M4 5h16M7 12h10M10 19h4"/>',

};
function icon(name, cls){ return `<svg class="${cls||''}" viewBox="0 0 24 24">${ICN[name]||''}</svg>`; }

/* ---------- utils ---------- */
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const nowISO = () => new Date().toISOString();
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }
function fmtDateShort(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}); }
function timeAgo(iso){
  const s = Math.floor((Date.now()-new Date(iso).getTime())/1000);
  if(s<60) return 'just now';
  if(s<3600) return Math.floor(s/60)+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago';
  if(s<86400*30) return Math.floor(s/86400)+'d ago';
  return fmtDate(iso);
}
function fmtMoney(n){
  n = Number(n)||0;
  const neg = n<0; n = Math.abs(n);
  let s;
  if(n>=1000000) s = (n/1000000).toFixed(1).replace(/\.0$/,'')+'M';
  else if(n>=1000) s = (n/1000).toFixed(1).replace(/\.0$/,'')+'K';
  else s = n.toFixed(0);
  return (neg?'-':'')+'$'+s;
}
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function initials(name){ return (name||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
function toast(msg, kind){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast'+(kind==='danger'?' danger':'');
  el.innerHTML = `<span class="t-dot"></span><span>${escapeHtml(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateY(6px)'; el.style.transition='all .25s'; setTimeout(()=>el.remove(),260); }, 2600);
}
function readFileAsDataURL(file){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); });
}

/* ---------- default data ---------- */
const DEFAULT_LABELS = [
  {id:'saas', name:'SaaS', icon:'💻', color:'#4E6A9C', description:'Software products', system:true},
  {id:'business', name:'Business', icon:'🏢', color:'#10213A', description:'Operating businesses', system:true},
  {id:'skill', name:'Skill', icon:'📈', color:'#2F7D52', description:'Skills being built', system:true},
  {id:'idea', name:'Idea', icon:'💡', color:'#9C7A1E', description:'Early-stage ideas', system:true},
  {id:'investment', name:'Investment', icon:'💰', color:'#2F6B7D', description:'Capital deployed', system:true},
  {id:'partnership', name:'Partnership', icon:'🤝', color:'#6E5AA6', description:'Joint ventures', system:true},
  {id:'archived', name:'Archived', icon:'📦', color:'#777777', description:'No longer active', system:true},
];
const STATUSES = ['Planning','Research','Design','Development','Testing','Launching','Growing','Paused','Completed','Archived'];
const STATUS_COLOR = {Planning:'#777777',Research:'#4E6A9C',Design:'#6E5AA6',Development:'#9C7A1E',Testing:'#9C7A1E',Launching:'#4E6A9C',Growing:'#2F7D52',Paused:'#777777',Completed:'#2F7D52',Archived:'#777777'};
const PRIORITIES = ['Low','Medium','High','Critical'];
const PRIORITY_COLOR = {Low:'#4E6A9C',Medium:'#9C7A1E',High:'#A8433F',Critical:'#A8433F'};
const ACCENTS = ['#4E6A9C','#10213A','#2F7D52','#A8433F','#6E5AA6','#2F6B7D','#9C7A1E'];

function defaultState(){
  return {
    version:1,
    settings:{ theme:'light', accent:'#4E6A9C', sidebarCollapsed:false, lastProject:null, view:'grid', searchHistory:[] },
    labels: JSON.parse(JSON.stringify(DEFAULT_LABELS)),
    projects: [],
    activity: [],
    quickNotes: [],
    todos: [],
  };
}

/* ---------- persistence ---------- */
const STORAGE_KEY = 'founderos_state_v1';
let state = loadState();
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    const base = defaultState();
    return Object.assign(base, parsed, {settings:Object.assign(base.settings, parsed.settings||{})});
  }catch(e){ console.error('load failed', e); return defaultState(); }
}
let saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch(e){ console.error('save failed', e); toast('Storage full — export a backup', 'danger'); }
  }, 120);
}
function logActivity(type, text, projectId){
  state.activity.unshift({id:uid(), ts:nowISO(), type, text, projectId:projectId||null});
  if(state.activity.length>500) state.activity.length = 500;
}
function addTodo(title, due){
  if(!title || !title.trim()) return;
  state.todos.unshift({id:uid(), title:title.trim(), due:due||'', done:false, created:nowISO()});
  save();
}
function toggleTodo(id){
  const td = state.todos.find(x=>x.id===id); if(!td) return;
  td.done = !td.done; save();
}
function deleteTodo(id){
  state.todos = state.todos.filter(x=>x.id!==id); save();
}
function todoRowHTML(td){
  const overdue = td.due && td.due < new Date().toISOString().slice(0,10) && !td.done;
  return `
  <div class="list-row" style="border:none; border-bottom:1px solid var(--border-soft); border-radius:0; margin-bottom:0; padding:10px 2px;" data-todo-row="${td.id}">
    <button class="checkbox ${td.done?'checked':''}" data-toggle-todo="${td.id}">${td.done?icon('check'):''}</button>
    <div style="flex:1; min-width:0;">
      <div class="row-title ${td.done?'done':''}">${escapeHtml(td.title)}</div>
      <div class="row-sub">Personal · ${td.due?fmtDateShort(td.due):'No due date'}${overdue?' · <span class="text-danger">overdue</span>':''}</div>
    </div>
    <button class="icon-btn" data-del-todo="${td.id}" style="width:26px;height:26px;">${icon('x')}</button>
  </div>`;
}
function bindTodoRowEvents(root){
  root.querySelectorAll('[data-toggle-todo]').forEach(b=> b.onclick=(e)=>{ e.stopPropagation(); toggleTodo(b.dataset.toggleTodo); render(); });
  root.querySelectorAll('[data-del-todo]').forEach(b=> b.onclick=(e)=>{ e.stopPropagation(); deleteTodo(b.dataset.delTodo); render(); });
}
function touchProject(p){ p.modified = nowISO(); }

/* ---------- router ---------- */
let route = {view:'dashboard', param:null};
function navigate(view, param){
  route = {view, param: param||null};
  location.hash = '#/'+view+(param?'/'+param:'');
  render();
}
window.addEventListener('hashchange', ()=>{
  const parts = location.hash.replace('#/','').split('/');
  route = {view: parts[0]||'dashboard', param: parts[1]||null};
  render();
});

/* ---------- project helpers ---------- */
function getLabel(id){ return state.labels.find(l=>l.id===id) || {name:'Unlabeled',color:'#777777',icon:'•'}; }
function activeProjects(){ return state.projects.filter(p=>!p.archived); }
function getProject(id){ return state.projects.find(p=>p.id===id); }
function newProjectSkeleton(){
  return {
    id: uid(), name:'Untitled Project', logo:null, banner:null,
    shortDesc:'', longDesc:'', labelId:'saas', status:'Planning', priority:'Medium',
    owner:'Faiz', coOwner:'', partners:[],
    created: nowISO(), modified: nowISO(),
    website:'', github:'', figma:'', domain:'',
    revenue:0, expenses:0, investment:0, equityPct:100, fundingStage:'Bootstrapped',
    notes:[], links:[], documents:[], milestones:[], tasks:[], passwords:[], customFields:[],
    pinned:false, archived:false, favorite:false, order: state.projects.length
  };
}

/* ---------- app shell render ---------- */
const NAV_ITEMS = [
  {section:'Overview', items:[
    {id:'dashboard', label:'Dashboard', icon:'dashboard'},
  ]},
  {section:'Workspace', items:[
    {id:'projects', label:'Projects', icon:'grid', count:()=>activeProjects().length},
    {id:'pinned', label:'Pinned', icon:'pin', count:()=>activeProjects().filter(p=>p.pinned).length},

function render(){

}

function bindTaskRowEvents(root){

    </div>

function bindProjectCardEvents(root){
  root.querySelectorAll('[data-card]').forEach(card=>{
    card.addEventListener('click', (e)=>{
      if(e.target.closest('.pcard-actions')) return;
      navigate('project', card.dataset.pid);
    });
    card.addEventListener('dragstart', (e)=>{ card.classList.add('dragging'); e.dataTransfer.setData('text/plain', card.dataset.pid); });
    card.addEventListener('dragend', ()=> card.classList.remove('dragging'));
    card.addEventListener('dragover', (e)=> e.preventDefault());
    card.addEventListener('drop', (e)=>{
      e.preventDefault();
      const draggedId = e.dataTransfer.getData('text/plain');
      const targetId = card.dataset.pid;
      if(draggedId===targetId) return;
      reorderProjects(draggedId, targetId);
    });
    card.querySelectorAll('[data-act]').forEach(btn=>{
      btn.onclick = (e)=>{
        e.stopPropagation();
        const p = getProject(card.dataset.pid); if(!p) return;
        const act = btn.dataset.act;
        if(act==='favorite'){ p.favorite=!p.favorite; touchProject(p); save(); render(); toast(p.favorite?'Added to favorites':'Removed from favorites'); }
        else if(act==='pin'){ p.pinned=!p.pinned; touchProject(p); logActivity('pin', `${p.pinned?'Pinned':'Unpinned'} "${p.name}"`, p.id); save(); render(); toast(p.pinned?'Pinned':'Unpinned'); }
        else if(act==='more'){ openProjectMoreMenu(p, btn); }
      };
    });
  });
}
function reorderProjects(draggedId, targetId){
  const list = state.projects;
  const di = list.findIndex(p=>p.id===draggedId), ti = list.findIndex(p=>p.id===targetId);
  if(di<0||ti<0) return;
  const [item] = list.splice(di,1);
  list.splice(ti,0,item);
  list.forEach((p,i)=> p.order=i);
  save(); render();
}
function openProjectMoreMenu(p, anchor){
  const items = [
    {label:'Open', act:()=> navigate('project', p.id)},
    {label:'Duplicate', act:()=> duplicateProject(p)},
    {label: p.archived? 'Restore':'Archive', act:()=> archiveProject(p, !p.archived)},
    {label:'Export JSON', act:()=> exportSingleProject(p)},
    {label:'Delete', act:()=> confirmModal(`Delete "${p.name}"?`, 'This permanently deletes the project and all its data. This cannot be undone.', ()=> deleteProject(p))},
  ];
  const menu = document.createElement('div');
  menu.className='card fade-in';
  menu.style.cssText='position:fixed; z-index:300; padding:6px; min-width:160px; box-shadow:var(--shadow-lg);';
  const rect = anchor.getBoundingClientRect();
  menu.style.top = (rect.bottom+6)+'px'; menu.style.left = Math.max(8, rect.right-170)+'px';
  menu.innerHTML = items.map((it,i)=>`<button data-mi="${i}" style="display:block; width:100%; text-align:left; padding:8px 10px; border-radius:8px; font-size:12.6px; ${it.label==='Delete'?'color:var(--danger)':''}">${it.label}</button>`).join('');
  document.body.appendChild(menu);
  menu.querySelectorAll('[data-mi]').forEach(b=> b.onmouseenter=()=>b.style.background='var(--bg-elev2)');
  menu.querySelectorAll('[data-mi]').forEach(b=> b.onmouseleave=()=>b.style.background='');
  menu.querySelectorAll('[data-mi]').forEach(b=> b.onclick=()=>{ items[+b.dataset.mi].act(); menu.remove(); });
  const closeMenu = (e)=>{ if(!menu.contains(e.target)){ menu.remove(); document.removeEventListener('click', closeMenu, true); } };
  setTimeout(()=> document.addEventListener('click', closeMenu, true), 10);
}
function duplicateProject(p){
  const copy = JSON.parse(JSON.stringify(p));
  copy.id = uid(); copy.name = p.name+' (Copy)'; copy.created=nowISO(); copy.modified=nowISO(); copy.pinned=false;
  copy.order = state.projects.length;
  copy.tasks.forEach(t=>t.id=uid()); copy.notes.forEach(n=>n.id=uid());
  state.projects.push(copy); logActivity('duplicate', `Duplicated "${p.name}"`, copy.id); save(); toast('Project duplicated'); render();
}
function archiveProject(p, archived){
  p.archived = archived; if(archived) p.pinned=false; touchProject(p);
  logActivity('archive', `${archived?'Archived':'Restored'} "${p.name}"`, p.id); save(); toast(archived?'Project archived':'Project restored'); render();
}
function deleteProject(p){
  state.projects = state.projects.filter(x=>x.id!==p.id);
  logActivity('delete', `Deleted "${p.name}"`, null); save(); toast('Project deleted','danger');
  navigate('projects');
}
function exportSingleProject(p){
  const blob = new Blob([JSON.stringify(p,null,2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${p.name.replace(/\\s+/g,'_')}.json`; a.click();
  toast('Exported '+p.name);
}

/* ================= PROJECTS LIST ================= */
let projectsUIState = { search:'', labelFilter:'', statusFilter:'', priorityFilter:'', sort:'order', view: state.settings.view||'grid' };
function renderProjects(opts){
  opts = opts||{};
  let list = opts.pinnedOnly ? activeProjects().filter(p=>p.pinned) : activeProjects();
  if(opts.labelFilter){ list = list.filter(p=>p.labelId===opts.labelFilter); projectsUIState.lockedLabel = opts.labelFilter; }
  else projectsUIState.lockedLabel = null;

  const ui = projectsUIState;
  if(ui.search) list = list.filter(p=> (p.name+' '+p.shortDesc+' '+p.owner).toLowerCase().includes(ui.search.toLowerCase()));
  if(ui.labelFilter) list = list.filter(p=>p.labelId===ui.labelFilter);
  if(ui.statusFilter) list = list.filter(p=>p.status===ui.statusFilter);
  if(ui.priorityFilter) list = list.filter(p=>p.priority===ui.priorityFilter);
  const sorters = {
    order:(a,b)=>a.order-b.order, name:(a,b)=>a.name.localeCompare(b.name),
    modified:(a,b)=>b.modified.localeCompare(a.modified), created:(a,b)=>b.created.localeCompare(a.created),
    revenue:(a,b)=>(b.revenue||0)-(a.revenue||0), priority:(a,b)=>PRIORITIES.indexOf(b.priority)-PRIORITIES.indexOf(a.priority),
  };
  list = [...list].sort(sorters[ui.sort]||sorters.order);

  const title = opts.title || (opts.pinnedOnly?'Pinned Projects':'All Projects');
  const sub = opts.sub || 'Every venture, product, and idea you\'re building.';

  root_html_projects(title, sub, list, opts);
}

/* ================= CALENDAR ================= */
let calState = { year: new Date().getFullYear(), month: new Date().getMonth() };
function renderCalendarView(root){
  const {year, month} = calState;
  const proj = activeProjects();
  const events = [];
  proj.forEach(p=>{
    p.tasks.forEach(t=> t.due && events.push({date:t.due, label:t.title, kind:'task'}));
    p.milestones.forEach(m=> m.date && events.push({date:m.date, label:m.title, kind:'milestone'}));
  });
  const first = new Date(year, month, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const daysInPrev = new Date(year, month, 0).getDate();
  const cells = [];
  for(let i=startDow-1;i>=0;i--) cells.push({d:daysInPrev-i, other:true});
  for(let i=1;i<=daysInMonth;i++) cells.push({d:i, other:false});
  while(cells.length%7!==0) cells.push({d:cells.length, other:true});
  const todayStr = new Date().toISOString().slice(0,10);
  const monthName = first.toLocaleDateString(undefined,{month:'long', year:'numeric'});

  root.innerHTML = `
    <div class="view-header">
      <div><div class="view-title">Calendar</div><div class="view-subtitle">Tasks and milestones across your portfolio.</div></div>
      <div style="display:flex; align-items:center; gap:10px;">
        <button class="icon-btn" id="calPrev">${icon('chevR')}</button>
        <div style="font-weight:600; min-width:150px; text-align:center;">${monthName}</div>
        <button class="icon-btn" id="calNext" style="transform:scaleX(-1);">${icon('chevR')}</button>
      </div>
    </div>
    <div class="cal-grid" style="margin-bottom:6px;">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}</div>
    <div class="cal-grid">
      ${cells.map(c=>{
        const dateStr = c.other?'':`${year}-${String(month+1).padStart(2,'0')}-${String(c.d).padStart(2,'0')}`;
        const dayEvents = c.other?[]:events.filter(e=>e.date===dateStr);
        return `<div class="cal-cell ${c.other?'other':''} ${dateStr===todayStr?'today':''}">
          <div class="cal-daynum">${c.d}</div>
          ${dayEvents.slice(0,3).map(e=>`<div class="cal-ev" title="${escapeHtml(e.label)}">${e.kind==='milestone'?'◆ ':''}${escapeHtml(e.label)}</div>`).join('')}
          ${dayEvents.length>3?`<div class="cal-ev" style="background:transparent; color:var(--text-faint);">+${dayEvents.length-3} more</div>`:''}
        </div>`;
      }).join('')}
    </div>
  `;
  updateCrumb('Calendar');
  document.getElementById('calPrev').onclick = ()=>{ calState.month--; if(calState.month<0){calState.month=11; calState.year--;} render(); };
  document.getElementById('calNext').onclick = ()=>{ calState.month++; if(calState.month>11){calState.month=0; calState.year++;} render(); };
}

}
function importAllData(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const imported = JSON.parse(reader.result);
      if(!imported.projects){ toast('Invalid backup file','danger'); return; }
      state = Object.assign(defaultState(), imported);
      applyTheme(); save(); navigate('dashboard'); toast('Backup restored');
    }catch(err){ toast('Could not read file','danger'); }
  };
  reader.readAsText(file);
}

/* ================= MODAL FRAMEWORK ================= */
function openModal(innerHTML, wide){
  closeModal();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay'; overlay.id='activeModalOverlay';
  overlay.innerHTML = `<div class="modal ${wide?'wide':''}">${innerHTML}</div>`;
  overlay.addEventListener('mousedown', (e)=>{ if(e.target===overlay) closeModal(); });
  document.body.appendChild(overlay);
  document.addEventListener('keydown', escCloseHandler);
  return overlay;
}
function escCloseHandler(e){ if(e.key==='Escape') closeModal(); }
function closeModal(){
  const el = document.getElementById('activeModalOverlay');
  if(el) el.remove();
  document.removeEventListener('keydown', escCloseHandler);
}

/* ---- confirm modal ---- */
function confirmModal(title, sub, onConfirm){
  const overlay = openModal(`
    <div class="modal-head"><div class="modal-title">${escapeHtml(title)}</div><button class="icon-btn" id="mClose">${icon('x')}</button></div>
    <div class="modal-body"><div style="color:var(--text-dim); font-size:13.3px;">${escapeHtml(sub)}</div></div>
    <div class="modal-foot"><button class="btn-ghost" id="mCancel">Cancel</button><button class="btn-danger" id="mConfirm">Confirm</button></div>
  `);
  overlay.querySelector('#mClose').onclick = closeModal;
  overlay.querySelector('#mCancel').onclick = closeModal;
  overlay.querySelector('#mConfirm').onclick = ()=>{ onConfirm(); closeModal(); };
}

/* ---- project create/edit wizard ---- */
let wizardDraft = null, wizardStep = 0;
function openProjectWizard(existing){
  wizardDraft = existing ? existing : newProjectSkeleton();
  wizardStep = 0;
  renderWizard(!!existing);
}
function renderWizard(isEdit){
  const steps = ['Basics','Details','Ownership','Finance'];
  const overlay = openModal(`
    <div class="modal-head"><div class="modal-title">${isEdit?'Edit Project':'New Project'}</div><button class="icon-btn" id="mClose">${icon('x')}</button></div>
    <div class="modal-body">
      <div class="wizard-steps">${steps.map((s,i)=>`<div class="wizard-dot ${i<=wizardStep?'active':''}"></div>`).join('')}</div>
      <div id="wizardStepBody"></div>
    </div>
    <div class="modal-foot">
      <button class="btn-ghost" id="wBack">${wizardStep===0?'Cancel':'Back'}</button>
      <button class="btn-primary" id="wNext">${wizardStep===steps.length-1?(isEdit?'Save Changes':'Create Project'):'Continue'}</button>
    </div>
  `, true);
  overlay.querySelector('#mClose').onclick = closeModal;
  renderWizardStep(wizardStep);
  overlay.querySelector('#wBack').onclick = ()=>{ if(wizardStep===0) closeModal(); else { wizardStep--; renderWizard(isEdit); } };
  overlay.querySelector('#wNext').onclick = ()=>{
    saveWizardStepFields(wizardStep);
    if(wizardStep < steps.length-1){ wizardStep++; renderWizard(isEdit); }
    else finishWizard(isEdit);
  };
}
function renderWizardStep(step){
  const body = document.getElementById('wizardStepBody');
  const d = wizardDraft;
  if(step===0){

function saveWizardStepFields(step){
  const d = wizardDraft; const g = id => document.getElementById(id);
  if(step===0){
    d.name = g('wName').value.trim()||'Untitled Project'; d.labelId = g('wLabel').value; d.status = g('wStatus').value;
    d.priority = g('wPriority').value; d.owner = g('wOwner').value; d.shortDesc = g('wShortDesc').value;
  }
  if(step===1){ d.longDesc=g('wLongDesc').value; d.website=g('wWebsite').value; d.domain=g('wDomain').value; d.github=g('wGithub').value; d.figma=g('wFigma').value; }
  if(step===2){ d.owner=g('wOwner2').value; d.coOwner=g('wCoOwner').value; }
  if(step===3){ d.revenue=+g('wRevenue').value||0; d.expenses=+g('wExpenses').value||0; d.investment=+g('wInvestment').value||0; d.equityPct=+g('wEquity').value||0; d.fundingStage=g('wFunding').value; }
}
function finishWizard(isEdit){
  const d = wizardDraft; touchProject(d);
  if(!isEdit){
    state.projects.push(d);
    logActivity('create', `Created "${d.name}"`, d.id);
    toast('Project created');
  } else {
    logActivity('edit', `Updated "${d.name}"`, d.id);
    toast('Changes saved');
  }
  save(); closeModal(); navigate('project', d.id);
}

/* ---- task modal ---- */
function openTaskModal(projectId, taskId){
  const p = getProject(projectId); if(!p) return;
  let t = taskId ? p.tasks.find(x=>x.id===taskId) : null;
  const isNew = !t;
  if(isNew) t = {id:uid(), title:'', description:'', due:'', priority:'Medium', status:'To Do', progress:0, subtasks:[], comments:[]};
  renderTaskModal(p, t, isNew);
}
function renderTaskModal(p, t, isNew){
  const overlay = openModal(`
    <div class="modal-head"><div class="modal-title">${isNew?'New Task':'Edit Task'}</div><button class="icon-btn" id="mClose">${icon('x')}</button></div>
    <div class="modal-body">
      <div class="field"><label>Title</label><input type="text" id="tkTitle" value="${escapeHtml(t.title)}"></div>
      <div class="field"><label>Description</label><textarea id="tkDesc">${escapeHtml(t.description||'')}</textarea></div>
      <div class="field-row">
        <div class="field"><label>Due Date</label><input type="date" id="tkDue" value="${t.due||''}"></div>
        <div class="field"><label>Priority</label><select id="tkPriority">${PRIORITIES.map(pr=>`<option ${t.priority===pr?'selected':''}>${pr}</option>`).join('')}</select></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Status</label><select id="tkStatus"><option ${t.status==='To Do'?'selected':''}>To Do</option><option ${t.status==='In Progress'?'selected':''}>In Progress</option><option ${t.status==='Done'?'selected':''}>Done</option></select></div>
        <div class="field"><label>Progress (%)</label><input type="number" id="tkProgress" min="0" max="100" value="${t.progress||0}"></div>
      </div>
      <div class="field">
        <label>Subtasks</label>
        <div id="subtaskList">${(t.subtasks||[]).map(s=>`
          <div class="list-row" style="padding:7px 10px;" data-sid="${s.id}">
            <button class="checkbox ${s.done?'checked':''}" data-stoggle="${s.id}">${s.done?icon('check'):''}</button>
            <span style="flex:1; font-size:12.6px; ${s.done?'text-decoration:line-through; color:var(--text-faint);':''}">${escapeHtml(s.title)}</span>
            <button class="icon-btn" data-sdel="${s.id}" style="width:22px;height:22px;">${icon('x')}</button>
          </div>`).join('')}</div>
        <div style="display:flex; gap:6px; margin-top:6px;"><input type="text" id="newSubtask" placeholder="Add subtask…" style="flex:1; background:var(--bg-elev2); border:1px solid var(--border); border-radius:9px; padding:7px 10px; font-size:12.6px;"><button class="btn-secondary" id="addSubtaskBtn">${icon('plus')}</button></div>
      </div>
    </div>
    <div class="modal-foot">
      ${!isNew?`<button class="btn-danger" id="tkDelete" style="margin-right:auto;">${icon('trash')}Delete</button>`:''}
      <button class="btn-ghost" id="mCancel">Cancel</button><button class="btn-primary" id="tkSave">${icon('check')}${isNew?'Create Task':'Save Task'}</button>
    </div>
  `);
  overlay.querySelector('#mClose').onclick = closeModal;
  overlay.querySelector('#mCancel').onclick = closeModal;
  overlay.querySelector('#addSubtaskBtn').onclick = ()=>{
    const inp = overlay.querySelector('#newSubtask'); if(!inp.value.trim()) return;
    t.subtasks = t.subtasks||[]; t.subtasks.push({id:uid(), title:inp.value.trim(), done:false});
    renderTaskModal(p, t, isNew);
  };
  overlay.querySelectorAll('[data-stoggle]').forEach(b=> b.onclick=()=>{ const s=t.subtasks.find(x=>x.id===b.dataset.stoggle); s.done=!s.done; renderTaskModal(p,t,isNew); });
  overlay.querySelectorAll('[data-sdel]').forEach(b=> b.onclick=()=>{ t.subtasks = t.subtasks.filter(x=>x.id!==b.dataset.sdel); renderTaskModal(p,t,isNew); });
  const delBtn = overlay.querySelector('#tkDelete');
  if(delBtn) delBtn.onclick = ()=> confirmModal('Delete this task?', 'This cannot be undone.', ()=>{ p.tasks = p.tasks.filter(x=>x.id!==t.id); touchProject(p); save(); closeModal(); render(); });
  overlay.querySelector('#tkSave').onclick = ()=>{
    t.title = overlay.querySelector('#tkTitle').value.trim()||'Untitled Task';
    t.description = overlay.querySelector('#tkDesc').value;
    t.due = overlay.querySelector('#tkDue').value;
    t.priority = overlay.querySelector('#tkPriority').value;
    t.status = overlay.querySelector('#tkStatus').value;
    t.progress = Math.max(0, Math.min(100, +overlay.querySelector('#tkProgress').value||0));
    if(isNew){ p.tasks.push(t); logActivity('task', `Added task "${t.title}" to "${p.name}"`, p.id); toast('Task created'); }
    else { logActivity('task', `Updated task "${t.title}"`, p.id); toast('Task saved'); }
    touchProject(p); save(); closeModal(); render();
  };
}

/* ---- global search modal ---- */
function openSearchModal(){
  const overlay = openModal(`
    <div class="modal-head" style="border-bottom:none; padding-bottom:10px;">
      <div class="search-inline" style="max-width:none; flex:1; background:var(--bg-elev2);">${icon('search')}<input type="text" id="gSearchInput" placeholder="Search projects, tasks, notes, documents…"></div>
      <button class="icon-btn" id="mClose">${icon('x')}</button>
    </div>
    <div class="modal-body" style="padding-top:6px;"><div class="search-results" id="searchResults"></div></div>
  `);
  const input = overlay.querySelector('#gSearchInput');
  overlay.querySelector('#mClose').onclick = closeModal;
  input.focus();
  input.oninput = ()=> renderSearchResults(input.value.trim());
  renderSearchResults('');
}
function renderSearchResults(q){
  const container = document.getElementById('searchResults'); if(!container) return;
  if(!q){ container.innerHTML = `<div class="empty-state" style="padding:30px 10px;"><div class="e-sub">Start typing to search everything</div></div>`; return; }
  const ql = q.toLowerCase();
  const results = [];
  activeProjects().forEach(p=>{
    if(p.name.toLowerCase().includes(ql)||p.shortDesc.toLowerCase().includes(ql)) results.push({type:'Project', icon:'grid', title:p.name, sub:getLabel(p.labelId).name, go:()=>navigate('project',p.id)});
    p.tasks.forEach(t=>{ if(t.title.toLowerCase().includes(ql)) results.push({type:'Task', icon:'check', title:t.title, sub:p.name, go:()=>openTaskModal(p.id,t.id)}); });
    p.notes.forEach(n=>{ if(n.text.toLowerCase().includes(ql)) results.push({type:'Note', icon:'note', title:n.text.slice(0,60), sub:p.name, go:()=>navigate('project',p.id)}); });
    p.documents.forEach(dc=>{ if(dc.name.toLowerCase().includes(ql)) results.push({type:'Document', icon:'file', title:dc.name, sub:p.name, go:()=>navigate('project',p.id)}); });
  });
  container.innerHTML = results.length ? results.slice(0,30).map((r,i)=>`
    <div class="search-result-item" data-ridx="${i}">
      <div class="search-result-icon">${icon(r.icon)}</div>
      <div style="flex:1; min-width:0;"><div class="sr-title">${escapeHtml(r.title)}</div><div class="sr-sub">${r.type} · ${escapeHtml(r.sub)}</div></div>
    </div>`).join('') : `<div class="empty-state" style="padding:30px 10px;"><div class="e-sub">No results for "${escapeHtml(q)}"</div></div>`;
  container.querySelectorAll('[data-ridx]').forEach(el=> el.onclick = ()=>{ results[+el.dataset.ridx].go(); closeModal(); });
}
document.addEventListener('keydown', (e)=>{
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); openSearchModal(); }
});

function pdDocuments(p){
  return `
  <div class="section-head"><div class="section-title">Documents & Assets (${p.documents.length})</div><button class="btn-primary" data-add="doc">${icon('plus')}Add Document</button></div>
  ${p.documents.length? p.documents.map(d=>`
    <div class="list-row">${icon('file')}
      <div style="flex:1; min-width:0;"><div class="row-title">${escapeHtml(d.name)}</div><div class="row-sub">${escapeHtml(d.desc)||'—'}${d.url?` · <a href="${d.url}" target="_blank" style="color:var(--info)">open</a>`:''}</div></div>
      <button class="icon-btn" data-del="doc" data-id="${d.id}">${icon('trash')}</button>
    </div>`).join('') : emptyState('folder','No documents yet','Store logos, brand guides, source files, PDFs, and more (as links or references).')}
  `;
}
function pdRoadmap(p){
  return `
  <div class="section-head"><div class="section-title">Roadmap & Milestones (${p.milestones.length})</div><button class="btn-primary" data-add="milestone">${icon('plus')}New Milestone</button></div>
  ${p.milestones.length? [...p.milestones].sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(m=>`
    <div class="list-row">
      <button class="checkbox ${m.done?'checked':''}" data-toggle-milestone="${m.id}">${m.done?icon('check'):''}</button>
      <div style="flex:1; min-width:0;"><div class="row-title ${m.done?'done':''}">${escapeHtml(m.title)}</div><div class="row-sub">${m.date?fmtDate(m.date):'No date'}</div></div>
      <button class="icon-btn" data-del="milestone" data-id="${m.id}">${icon('trash')}</button>
    </div>`).join('') : emptyState('flag','No milestones yet','Map out the key moments on this project\'s roadmap.')}
  `;
}
function pdFinance(p){
  const rev=Number(p.revenue)||0, exp=Number(p.expenses)||0, profit=rev-exp, inv=Number(p.investment)||0;
  const roi = inv>0 ? ((profit/inv)*100).toFixed(1)+'%' : '—';
  return `
  <div class="kv-grid section-block">
    <div class="kv-item"><div class="kv-label">Revenue</div><div class="kv-value mono text-success">${fmtMoney(rev)}</div></div>
    <div class="kv-item"><div class="kv-label">Expenses</div><div class="kv-value mono text-danger">${fmtMoney(exp)}</div></div>
    <div class="kv-item"><div class="kv-label">Profit / Loss</div><div class="kv-value mono ${profit<0?'text-danger':'text-success'}">${fmtMoney(profit)}</div></div>
    <div class="kv-item"><div class="kv-label">Investment</div><div class="kv-value mono">${fmtMoney(inv)}</div></div>
    <div class="kv-item"><div class="kv-label">Equity Held</div><div class="kv-value mono">${p.equityPct||0}%</div></div>
    <div class="kv-item"><div class="kv-label">Funding Stage</div><div class="kv-value">${escapeHtml(p.fundingStage)||'—'}</div></div>
    <div class="kv-item"><div class="kv-label">ROI</div><div class="kv-value mono">${roi}</div></div>
    <div class="kv-item"><div class="kv-label">Cash Flow</div><div class="kv-value mono ${profit<0?'text-danger':'text-success'}">${profit>=0?'Positive':'Negative'}</div></div>
  </div>
  <div class="section-block">
    <div class="section-title" style="margin-bottom:10px;">Revenue vs Expenses</div>
    <div class="card" style="padding:16px;">${miniBarChart(rev,exp)}</div>
  </div>
  <div class="field-hint">Edit these figures from the Edit button on the project header.</div>
  `;
}
function miniBarChart(rev, exp){
  const max = Math.max(rev, exp, 1);
  const w = 100;
  const rw = (rev/max*w).toFixed(1), ew = (exp/max*w).toFixed(1);
  return `
  <svg viewBox="0 0 100 46" style="width:100%; height:90px;">
    <text x="0" y="6" font-size="4" fill="var(--text-faint)">Revenue</text>
    <rect x="0" y="9" width="${rw}" height="10" rx="2" fill="var(--success)"/>
    <text x="0" y="30" font-size="4" fill="var(--text-faint)">Expenses</text>
    <rect x="0" y="33" width="${ew}" height="10" rx="2" fill="var(--danger)"/>
  </svg>`;
}
function pdTeam(p){
  return `
  <div class="kv-grid section-block">
    <div class="kv-item"><div class="kv-label">Owner</div><div class="kv-value">${escapeHtml(p.owner)||'—'}</div></div>
    <div class="kv-item"><div class="kv-label">Co-owner</div><div class="kv-value">${escapeHtml(p.coOwner)||'—'}</div></div>
  </div>
  <div class="section-head"><div class="section-title">Partners & Team (${p.partners.length})</div><button class="btn-ghost" data-add="partner">${icon('plus')}Add Person</button></div>
  ${p.partners.length? p.partners.map(pt=>`
    <div class="list-row">
      <div class="pcard-logo" style="width:32px;height:32px; font-size:12px;">${initials(pt.name)}</div>
      <div style="flex:1; min-width:0;"><div class="row-title">${escapeHtml(pt.name)}</div><div class="row-sub">${escapeHtml(pt.role)||'—'}</div></div>
      <button class="icon-btn" data-del="partner" data-id="${pt.id}">${icon('trash')}</button>
    </div>`).join('') : emptyState('users','No team members yet','Add co-owners, partners, employees, freelancers, or investors.')}
  `;
}
function pdActivity(p){
  const items = state.activity.filter(a=>a.projectId===p.id);
  return `<div class="section-title" style="margin-bottom:10px;">Activity History</div>
  <div class="card" style="padding:12px 16px;">${items.length? items.map(activityRowHTML).join('') : emptyState('bell','No activity yet','Actions on this project will be tracked here.')}</div>`;
}
function pdSettings(p){
  return `
  <div class="section-block">
    <div class="section-head"><div class="section-title">${icon('lock')} Passwords <span style="font-weight:400; text-transform:none; letter-spacing:0; color:var(--text-faint);">(hidden section)</span></div><button class="btn-ghost" data-add="password">${icon('plus')}Add Credential</button></div>
    ${p.passwords.length? p.passwords.map(pw=>`
      <div class="list-row">
        <div style="flex:1; min-width:0;"><div class="row-title">${escapeHtml(pw.label)}</div>
          <div class="pw-row"><span class="row-sub mono" id="pwval-${pw.id}" data-pwvalue="${escapeHtml(pw.value)}">••••••••</span>
            <button class="pw-toggle" data-togglepw="${pw.id}">${icon('eye')}</button></div>
        </div>
        <button class="icon-btn" data-del="password" data-id="${pw.id}">${icon('trash')}</button>
      </div>`).join('') : emptyState('lock','No credentials stored','Keep sensitive logins here — hidden from view by default.')}
  </div>
  <div class="section-block">
    <div class="section-title" style="margin-bottom:10px; color:var(--danger);">Danger Zone</div>
    <div class="card" style="padding:16px; border-color:var(--danger-soft); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;">
      <div><div class="row-title">Delete this project</div><div class="row-sub">Permanently removes all data. This cannot be undone.</div></div>
      <button class="btn-danger" data-deleteproj>${icon('trash')}Delete Project</button>
    </div>
  </div>`;
}

function bindPdTabEvents(p){
  const c = document.getElementById('pdTabContent');
  bindTaskRowEvents(c);
  c.querySelectorAll('[data-opentask]').forEach(row=> row.onclick=(e)=>{ if(e.target.closest('button')) return; openTaskModal(p.id, row.dataset.opentask); });
  c.querySelectorAll('[data-add]').forEach(b=> b.onclick = ()=> handlePdAdd(p, b.dataset.add));
  c.querySelectorAll('[data-del]').forEach(b=> b.onclick = ()=> handlePdDelete(p, b.dataset.del, b.dataset.id));
  c.querySelectorAll('[data-toggle-milestone]').forEach(b=> b.onclick=()=>{
    const m = p.milestones.find(x=>x.id===b.dataset.toggleMilestone); m.done=!m.done; touchProject(p); save(); render();
  });
  c.querySelectorAll('[data-togglepw]').forEach(b=> b.onclick=()=>{
    const span = document.getElementById('pwval-'+b.dataset.togglepw);
    const shown = span.dataset.shown==='1';
    span.textContent = shown ? '••••••••' : span.dataset.pwvalue;
    span.dataset.shown = shown?'0':'1';
    b.innerHTML = shown? icon('eye') : icon('eyeOff');
  });
  const delProjBtn = c.querySelector('[data-deleteproj]');
  if(delProjBtn) delProjBtn.onclick = ()=> confirmModal(`Delete "${p.name}"?`, 'This permanently deletes the project and all its data.', ()=> deleteProject(p));
}
function handlePdDelete(p, type, id){
  const map = {link:'links', field:'customFields', doc:'documents', milestone:'milestones', partner:'partners', password:'passwords', task:'tasks', note:'notes'};
  const key = map[type]; if(!key) return;
  p[key] = p[key].filter(x=>x.id!==id);
  touchProject(p); save(); render();
}
function handlePdAdd(p, type){
  if(type==='note'){
    const ta = document.getElementById('newNoteText'); if(!ta.value.trim()) return;
    p.notes.unshift({id:uid(), text:ta.value.trim(), created:nowISO()});
    touchProject(p); logActivity('note', `Added a note to "${p.name}"`, p.id); save(); render(); toast('Note added'); return;
  }
  if(type==='task'){ openTaskModal(p.id, null); return; }
  if(type==='link'){ openQuickFieldModal('Add Link', [{key:'title',label:'Title'},{key:'url',label:'URL'}], (v)=>{ p.links.push({id:uid(),title:v.title,url:v.url}); touchProject(p); save(); render(); }); return; }
  if(type==='field'){ openQuickFieldModal('Add Custom Field', [{key:'key',label:'Field Name'},{key:'value',label:'Value'}], (v)=>{ p.customFields.push({id:uid(),key:v.key,value:v.value}); touchProject(p); save(); render(); }); return; }
  if(type==='doc'){ openQuickFieldModal('Add Document', [{key:'name',label:'Name'},{key:'desc',label:'Description'},{key:'url',label:'Link (optional)'}], (v)=>{ p.documents.push({id:uid(),name:v.name,desc:v.desc,url:v.url}); touchProject(p); logActivity('document', `Added document "${v.name}" to "${p.name}"`, p.id); save(); render(); }); return; }
  if(type==='milestone'){ openQuickFieldModal('New Milestone', [{key:'title',label:'Title'},{key:'date',label:'Date',type:'date'}], (v)=>{ p.milestones.push({id:uid(),title:v.title,date:v.date,done:false}); touchProject(p); save(); render(); }); return; }
  if(type==='partner'){ openQuickFieldModal('Add Person', [{key:'name',label:'Name'},{key:'role',label:'Role (Partner / Employee / Investor…)'}], (v)=>{ p.partners.push({id:uid(),name:v.name,role:v.role}); touchProject(p); save(); render(); }); return; }
  if(type==='password'){ openQuickFieldModal('Add Credential', [{key:'label',label:'Label'},{key:'value',label:'Password / Secret'}], (v)=>{ p.passwords.push({id:uid(),label:v.label,value:v.value}); touchProject(p); save(); render(); }); return; }
}

/* ================= ARCHIVED VIEW ================= */
function renderArchivedView(root){
  const list = state.projects.filter(p=>p.archived);
  root.innerHTML = `
    <div class="view-header"><div><div class="view-title">Archived</div><div class="view-subtitle">Wound down, paused indefinitely, or retired ventures.</div></div></div>
    <div id="archWrap">${list.length? `<div class="project-grid">${list.map(projectCardHTML).join('')}</div>` : emptyState('archive','Nothing archived','Projects you archive will land here, fully preserved.')}</div>
  `;
  updateCrumb('Archived');
  bindProjectCardEvents(root);
}
init();
</script>
